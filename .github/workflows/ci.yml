name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - name: cached tool downloads
        uses: actions/cache@v4
        with:
          path: ~/tools-cache
          key: tools-kopia-0.23.1-duplicacy-3.3.0
      - name: backup tools for the end-to-end tests (EP-1, COMPAT-1)
        env:
          # Pinned releases, checked against the SHA-256 each project
          # publishes (Kopia's checksums.txt; GitHub's asset digest for
          # Duplicacy, which publishes none of its own).
          KOPIA_VERSION: 0.23.1
          KOPIA_SHA256: 416d0f84a3dbb321a8b2d8f0997b1a0a6e915babe79ee76fa6e4d2bd1e1c5178
          DUPLICACY_VERSION: 3.3.0
          DUPLICACY_SHA256: a2ac4db7018633b116506e081a029dd6635e9619cf24b85c33144640613416ee
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic rclone
          # Downloads are cached, so a GitHub release outage only matters
          # when the pinned versions change.
          mkdir -p ~/tools-cache && cd ~/tools-cache
          [ -f kopia.tar.gz ] || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o kopia.tar.gz "https://github.com/kopia/kopia/releases/download/v${KOPIA_VERSION}/kopia-${KOPIA_VERSION}-linux-x64.tar.gz"
          echo "${KOPIA_SHA256}  kopia.tar.gz" | sha256sum -c -
          tar xzf kopia.tar.gz -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/kopia-${KOPIA_VERSION}-linux-x64/kopia" /usr/local/bin/kopia
          [ -f duplicacy ] || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o duplicacy "https://github.com/gilbertchen/duplicacy/releases/download/v${DUPLICACY_VERSION}/duplicacy_linux_x64_${DUPLICACY_VERSION}"
          echo "${DUPLICACY_SHA256}  duplicacy" | sha256sum -c -
          sudo install -m 0755 duplicacy /usr/local/bin/duplicacy
          restic version; rclone version | head -1; aws --version; kopia --version; duplicacy 2>&1 | grep -A1 VERSION
      - run: go vet ./...
      - run: go test -race -timeout 30m ./...
      - name: SEC-11 test build (admission admits everyone; the middleware alone refuses)
        run: go test -race -tags admitall -run TestMiddlewareAloneRefusesStranger ./internal/cli

  # Scenario 12's first half against a real S3 provider (S3-1 to S3-3,
  # S3-7, #38): a Garage container, DESIGN §3.11's tier 2. The test
  # skips everywhere else.
  overflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: restic
        run: sudo apt-get update -qq && sudo apt-get install -y -qq restic
      - name: Garage
        run: .github/garage.sh lendisk-ci-garage "$RUNNER_TEMP/garage" >> "$GITHUB_ENV"
      - run: go test -race -timeout 15m -run 'TestScenarioOverflowAtAnExternalProvider' -v ./internal/cli
      - name: stop Garage
        if: always()
        run: docker rm -f lendisk-ci-garage

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: amd64 }
          - { goarch: arm64 }
          - { goarch: arm, goarm: "7" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: static build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w -X github.com/borje/lendisk/internal/version.Version=${GITHUB_SHA::12}" -o lendisk ./cmd/lendisk
          file lendisk
