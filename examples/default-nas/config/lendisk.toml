# Anna · default install · DESIGN.md v0.12
#
# Friendships and buckets are not here: `lendisk invite`, `lendisk peer
# add` and `lendisk bucket add` create them and they live in lendisk.db.
# Every friendship is one quota that both sides lend each other (P-8).
# After init (S ≈ 250 GB at 2 copies: lend 1.2 × 2 × 250 = 600 GB), Anna ran:
#   lendisk invite --quota 200G --retention 30d     # Björn
#   lendisk invite --quota 250G --retention 30d     # Carla
#   lendisk invite --quota 150G --retention 30d     # Dag
#   lendisk bucket add laptop --profile restic      # copies = 2, placed over the pool
#   lendisk overflow add s3 b2 \
#     --endpoint https://s3.eu-central-003.backblazeb2.com --region eu-central-003 \
#     --bucket anna-lendisk --prefix anna --max-bytes 300G --price-per-gb 0.006
#                                                   # only for what friends cannot hold (§4.11)
# Each friendship's number is Anna's own; the smaller of the two sides'
# numbers is the quota in force (LEND-8): lendisk peer quota <peer> <bytes>.

# Lines commented out show a setting at its default, or one Anna does not
# use; every setting lendisk has appears once in these examples.

role = "full"
# data_dir = "/var/lib/lendisk"   # lendisk.db, store/, run/: the compose data volume

[endpoint]
# S3 for backup tools on this host (EP-1, EP-5); loopback only.
# loopback = "127.0.0.1:9000"
# Other machines on the LAN reach S3 through [[endpoint.listen]] entries
# (EP-17): an address, or an interface and a port; TLS is generated
# unless tls = "off" or "files" (with cert and key).
# [[endpoint.listen]]
# address = "192.168.1.10:9000"
# tls     = "generate"

[metrics]
listen = "127.0.0.1:9101"   # Prometheus at /metrics (OPS-4); loopback only

[store]
# One store serves both roles (D15): Anna's own buckets and every
# lent-<id>-<sealed> buckets her friends write sit side by side as plain files.
backend          = "posix"
path             = "/var/lib/lendisk/store"
free_space_floor = "5%"      # LEND-2: refuse borrowers' writes below this
reconcile_every  = "24h"     # EP-14: compare the store with what was captured
reconcile_delete_limit = 10  # EP-14: more missing than this % deletes nothing until confirmed
bitrot_sample    = "0.1"     # VER-5: % of the stored bytes hashed a week to find bit-rot
bitrot_read_limit = "8M"     # VER-5: the sample's disk reads, bytes a second

[tunnel]
# The tunnel port is always 9000 inside WireGuard (lender-facing S3 + control API).
region = "ams"               # DERP bootstrap region chosen at init; part of the address (SEC-14)
# port = 41641               # NET-3: a fixed UDP port for a port forward; 0 picks any

[relays]
# NET-5: relays of her own replace the project's relay map; with any of
# them, Tailscale's hosted relays are left out unless asked for.
map_url           = "https://relays.lendisk.example/derpmap.json"
accept_peer_hints = false    # NET-5a: only relays Anna configured may see her traffic
# tailscale_bootstrap = true # also use Tailscale's hosted relays as a last resort
# A relay a friend runs with `lendisk relay` (examples/relay-vps), its
# entry as the relay logs it:
# [[relays.list]]
# host      = "relay.dag.example"
# port      = 8443
# stun_port = 3478
# cert      = "sha256-raw:<64 hex digits from the relay's log>"

[lending]
# Retention is per friendship, offered with `invite --retention` (RET-1).
max_total     = "600G"       # LEND-1: cap on the sum of Anna's own numbers

[replication]
# Pacing (REPL-6, REPL-7) applies without a restart: the daemon looks
# at this file every 10 s, and at once on SIGHUP (systemctl reload).
upload_limit   = "20M"       # REPL-7: bytes a second replication sends, all friends together
# download_limit = "50M"     # REPL-7: what fetching back from friends may use
schedule       = "01:00-07:00, 12:00-13:00"   # when replication may send (local time)
part_size      = "16M"       # REPL-6: larger objects go in parts and resume at the next part
copies         = 2           # EP-6: for `bucket add` without --copies; the default
reroute_after  = "1h"        # D6: unsent copies at a friend failing this long go elsewhere
replace_after  = "168h"      # REPL-12: a friend silent this long is no longer room
overflow_sample = "0.1"      # VER-2: % of the overflow target's bytes downloaded and checked a week

# REPL-7: Björn is relayed through DERP; be gentle. A friend is named by
# its node ID, as `lendisk peer list` shows it.
# [[replication.peer_limit]]
# peer   = "<Björn's node ID>"
# upload = "8M"

# LEND-5: what Björn may send this node and read from it, as a borrower.
# [[lending.borrower_limit]]
# peer    = "<Björn's node ID>"
# receive = "4M"
# send    = "8M"

# Overflow target (§4.11, S3-1): second choice, used only for copies
# Björn, Carla and Dag have no room for, and drained back to them when
# they do (REPL-13). It is not in this file: `lendisk overflow add`
# (see the top) writes it to lendisk.db, and the manifest carries it
# for recovery. Only its credential comes from the environment:
#   LENDISK_OVERFLOW_B2_ACCESS_KEY / LENDISK_OVERFLOW_B2_SECRET_KEY
# Use an application key that can hide files but not delete versions
# (S3-5); the bucket has versioning on and a lifecycle rule removing
# hidden versions after 30 days (S3-4), which `overflow add` checked
# and offered to create. max_bytes 300G is the room it adds to the
# pool (S3-7): alert at 90%, stop at 100%. VER-2's sample is all it
# gets by default; `lendisk overflow set b2 --full-cycle 90d` would also
# download every object there once in 90 days, at the egress price.

[verify]
# VER-1a: besides the daily random challenge, every object a friend
# holds is challenged whole once a cycle, a slice a day, so a small
# silent loss (a bad sector) is found within it.
full_cycle = "30d"           # the default

[alerts]
# OPS-3: the hook receives each alert as JSON on stdin. Uncomment once
# the file exists: serve refuses to start otherwise. It must be an
# absolute path to one executable file (chmod +x), with no arguments;
# put arguments in the script. The image has no shell (distroless), so
# in a container the hook is a static program, or a script whose
# interpreter you mount in; under systemd a shell script works. For
# example /etc/lendisk/hooks/ntfy.sh:
#   #!/bin/sh
#   exec curl -fsS -H 'Title: lendisk alert' --data-binary @- https://ntfy.sh/your-topic
# command = "/etc/lendisk/hooks/ntfy.sh"
# webhook = "https://hc-ping.com/your-uuid" # OPS-3: healthchecks.io style
unreachable_after = "24h"                 # OPS-2: the default

[log]
level = "info"               # OPS-5: structured, to stdout
# format = "json"            # text (logfmt) by default
