# Björn · store is the Garage he already runs · DESIGN.md v0.12
#
# POST-V1 EXAMPLE. The `s3` store backend (EP-16) is not in v1; this
# folder is kept for v1.1. In v1 Björn runs the default install with
# plain files on his server's disk (see default-nas).
#
# After init:
#   lendisk peer add <Anna's invite>                # 200 GB each way
#   lendisk invite --quota 200G --retention 30d     # Dag
#   lendisk bucket add photos --profile restic      # copies = 2
# With two friends and two copies, every pack is at both Anna and Dag.
#
# Retention for Anna's replica is the decorator's tombstones under
# .lendisk/tomb/ in her lent bucket, as on every store (RET-1).

role = "full"

[endpoint]
# S3 for backup tools on this host is always 127.0.0.1:9000 (EP-1, EP-5).
# LAN addresses, if any, would be [[endpoint.listen]] entries (EP-17).

[metrics]
listen = "127.0.0.1:9101"   # Prometheus at /metrics (OPS-4); loopback only

[store]
# Any S3-compatible service the user names (EP-16). Each lendisk bucket
# is an upstream bucket of the same name (photos, lent-<id>-<sealed name of laptop>,
# lendisk-manifests), so the key needs permission to create buckets.
# Credential: LENDISK_STORE_ACCESS_KEY / LENDISK_STORE_SECRET_KEY.
backend  = "s3"
endpoint = "http://127.0.0.1:3900"   # Garage, published on the host's loopback
region   = "garage"

[tunnel]
# The tunnel port is always 9000 inside WireGuard.
region = "ams"

[relays]
map_url           = "https://relays.lendisk.example/derpmap.json"
accept_peer_hints = false

[lending]
# Retention is per friendship, offered with `invite --retention` (RET-1).
max_total     = "600G"

[replication]
upload_limit = "5M"          # CGNAT upstream is thin; Anna is reached through a relay
schedule     = "00:00-06:00"
part_size    = "16M"

[alerts]
webhook = "https://ntfy.sh/bjorn-lendisk"

[log]
level = "info"
