# Single-node Garage for Björn's homelab. Garage's own documentation is
# authoritative; this is the minimum lendisk needs from it.
#
# First run, once:
#   docker compose exec garage garage status
#   docker compose exec garage garage layout assign -z home -c 2T <node-id>
#   docker compose exec garage garage layout apply --version 1
#   docker compose exec garage garage key create lendisk
#   docker compose exec garage garage key allow --create-bucket lendisk
# Put the key's id and secret in lendisk.env as LENDISK_STORE_ACCESS_KEY
# and LENDISK_STORE_SECRET_KEY. lendisk creates its buckets itself.

metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "lmdb"

replication_factor = 1
compression_level  = "none"       # repositories are already encrypted; nothing to gain

rpc_bind_addr = "0.0.0.0:3901"    # bridge-internal only; not published in compose
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "replace-with-32-random-bytes-in-hex"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"    # published as 127.0.0.1:3900 on the host
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "0.0.0.0:3903"    # published as 127.0.0.1:3903 on the host
admin_token = "replace-with-a-long-random-token"
