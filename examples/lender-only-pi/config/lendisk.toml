# Carla · lender-only · DESIGN.md v0.12
#
# `lendisk init --lender-only` wrote role = "lender": a node with no
# buckets yet (PEER-9). The tool-facing endpoint and the borrower-side
# machinery are off. Her friendships are symmetric like anyone's, so
# Anna and Dag lend her the same amount back; it stays unused until
# she adds a bucket, and `lendisk status` shows it as unused. Carla ran:
#   lendisk peer add <Anna's invite>                # 250 GB each way
#   lendisk invite --quota 200G --retention 60d     # Dag

role = "lender"

[endpoint]
# Nothing on loopback in this profile (PEER-9 AC): no S3 endpoint and no
# metrics listener: an [[endpoint.listen]] entry or [metrics] listen is
# refused at config load.

[store]
backend          = "posix"
path             = "/var/lib/lendisk/store"   # on the USB disk; lent-<id>-<sealed> directories (SEC-16)
free_space_floor = "5%"
bitrot_read_limit = "4M"     # VER-5: keep the bit-rot sample gentle on the Pi's USB disk

[tunnel]
# The tunnel port is always 9000 inside WireGuard.
region = "ams"

[relays]
map_url           = "https://relays.lendisk.example/derpmap.json"
accept_peer_hints = false

[lending]
retention_min = "60d"        # Carla's window is longer than the 30-day default
max_total     = "700G"       # the disk is 1 TB; keep headroom for tombstones (RET-1)

[alerts]
# The hook receives each alert as JSON on stdin (OPS-3). Uncomment once
# the file exists: serve refuses to start otherwise. It must be an
# absolute path to one executable file (chmod +x), with no arguments;
# put arguments in the script. A shell script needs /bin/sh in the
# image. For example /etc/lendisk/hooks/ntfy.sh:
#   #!/bin/sh
#   exec curl -fsS -H 'Title: lendisk alert' --data-binary @- https://ntfy.sh/your-topic
# command = "/etc/lendisk/hooks/ntfy.sh"

[log]
level = "info"
